services:

  mongodb: 
    image: mongo:8
    container_name: task-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend
    container_name: task-backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/taskmanager
      - PORT=5000
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: task-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongodb_data: