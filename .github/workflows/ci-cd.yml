name: CI

on: 
      push:
            branches: 
                  - main
                  - develop

      pull_request:
            branches: 
                  - main
jobs:
     
      backend: 
            name: Backend CI
            runs-on: ubuntu-latest
            
            defaults:
                  run:
                        working-directory: backend
            steps:
                  - name: Checkout
                    uses: actions/checkout@v4

                  - name: Set up Node.js
                    uses: actions/setup-node@v4
                    with:
                        node-version: 22
                        cache: 'npm'
                        cache-dependency-path: backend/package-lock.json

                  - name: Install dependencies
                    run: npm install

                  - name: Check application
                    run: node --check src/server.js
      
      frontend:
            name: Frontend CI
            runs-on: ubuntu-latest
            defaults:
                  run:
                        working-directory: frontend
            steps:
                  - name: Checkout
                    uses: actions/checkout@v4

                  - name: Set up Node
                    uses: actions/setup-node@v4
                    with:
                        node-version: 22
                        cache: 'npm'
                        cache-dependency-path: frontend/package-lock.json

                  - name: Install dependencies
                    run: npm install

                  - name: Check application
                    run: npm run build

      docker:
            name: Docker Build
            runs-on: ubuntu-latest
            needs: 
                  - backend
                  - frontend
            steps:
                  - name: Checkout
                    uses: actions/checkout@v4

                  - name: Build backend Image
                    run: docker build -t task-manager-backend ./backend

                  - name: Build frontend Image
                    run: docker build -t task-manager-frontend ./frontend

      docker-hub:
            name: Docker Hub
            runs-on: ubuntu-latest
            needs: 
                  - docker
            
            if: github.ref == 'refs/heads/main'
            steps:
                  - name: Checkout
                    uses: actions/checkout@v4

                  - name: Login to Docker Hub
                    uses: docker/login-action@v3
                    with:
                          username: ${{ secrets.DOCKER_USERNAME }}
                          password: ${{ secrets.DOCKER_PASSWORD }}      

                  - name: Push backend Image
                    run:  |
                        docker build \
                        -t ${{ secrets.DOCKER_USERNAME }}/task-manager-backend:latest \
                        ./backend
                        
                  - name: Push frontend Image
                    run:  |
                        docker build \
                        -t ${{ secrets.DOCKER_USERNAME }}/task-manager-frontend:latest \
                        ./frontend
                  
                  - name: Push backend Image
                    run:  |
                        docker push \
                        ${{ secrets.DOCKER_USERNAME }}/task-manager-backend:latest

                  - name: Push frontend Image
                    run:  |
                        docker push \
                        ${{ secrets.DOCKER_USERNAME }}/task-manager-frontend:latest